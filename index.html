<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Monitoramento de Caminhões</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>🚚 Monitoramento de Frota</h1>
  <p class="subtitulo">Alerta de manutenção preventiva ao atingir 10.000 km</p>

  <!-- Formulário para cadastrar caminhão -->
  <div class="formulario">
    <h3>Cadastrar Caminhão</h3>

    <label for="placa">Placa</label>
    <input type="text" id="placa" placeholder="Ex: ABC1D23">

    <label for="km">Quilometragem rodada (km)</label>
    <input type="number" id="km" placeholder="Ex: 8500">

    <button onclick="adicionarCaminhao()">Adicionar</button>
  </div>

  <!-- Tabela que mostra os caminhões -->
  <table>
    <thead>
      <tr>
        <th>Placa</th>
        <th>Quilometragem</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="tabelaCaminhoes">
      <!-- as linhas vão ser criadas pelo JavaScript -->
    </tbody>
  </table>

  <p id="vazio">Nenhum caminhão cadastrado ainda.</p>

  <script src="script.js"></script>
</body>
</html>
